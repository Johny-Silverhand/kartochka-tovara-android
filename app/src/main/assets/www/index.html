<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Карточка товара</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-node">// KARTOCHKA_ANDROID // v1.0.0</div>
        <h1>Карточки</h1>
        <p class="muted">Локальная БД на устройстве · до 4 фото</p>
      </div>
      <button type="button" class="btn primary" id="btnNew">+ Новая карточка</button>
      <ul class="list" id="cardList"></ul>
      <footer class="foot">разработано в Victimok Labs</footer>
    </aside>
    <main class="main">
      <div class="empty" id="emptyState">
        <h2>Нет выбранной карточки</h2>
        <p>Создай карточку — она сохранится в локальной SQLite на телефоне. Фото до 4 шт., листай стрелками или свайпом.</p>
      </div>
      <section class="editor hidden" id="editor">
        <div class="card-frame">
          <div class="photo-wrap" id="photoWrap">
            <img id="photoPreview" alt="" class="hidden" />
            <div class="photo-placeholder" id="photoPlaceholder">Нет фото</div>
            <button type="button" class="nav-arrow nav-prev" id="btnPrev" aria-label="Предыдущее">‹</button>
            <button type="button" class="nav-arrow nav-next" id="btnNext" aria-label="Следующее">›</button>
            <div class="photo-counter" id="photoCounter"></div>
            <div class="photo-toolbar">
              <label class="photo-btn" id="photoAddLabel">
                Добавить фото
                <input type="file" id="photoInput" accept="image/*" hidden />
              </label>
              <button type="button" class="photo-btn danger-btn" id="btnRemovePhoto">Убрать</button>
            </div>
          </div>
          <div class="fields">
            <label>Название
              <input type="text" id="fieldName" maxlength="200" placeholder="Название товара" />
            </label>
            <label>Описание
              <textarea id="fieldDesc" rows="8" placeholder="Описание, комплектация…"></textarea>
            </label>
            <div class="actions">
              <button type="button" class="btn primary" id="btnSave">Сохранить</button>
              <button type="button" class="btn danger" id="btnDelete">Удалить</button>
            </div>
            <p class="status" id="status"></p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
